    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff;
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            -webkit-text-size-adjust: 100%;
        }

        .lp-image {
            display: block;
            width: 100%;
        }

        /* 画像下CTA */
        .cta-section {
            padding: 24px 16px 20px;
            text-align: center;
            background: #fff8f0;
        }

        .cta-btn {
            display: block;
            width: 92%;
            max-width: 440px;
            margin: 0 auto;
            padding: 20px 16px;
            background: #06C755;
            color: #fff;
            font-size: clamp(16px, 4.5vw, 20px);
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            letter-spacing: 0.04em;
            box-shadow: 0 6px 20px rgba(6, 199, 85, 0.45);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1);    box-shadow: 0 6px 20px rgba(6,199,85,0.45); }
            50%  { transform: scale(1.03); box-shadow: 0 8px 28px rgba(6,199,85,0.65); }
            100% { transform: scale(1);    box-shadow: 0 6px 20px rgba(6,199,85,0.45); }
        }

        .cta-btn:active { opacity: 0.85; transform: scale(0.98); }

        .cta-label {
            display: block;
            font-size: 11px;
            font-weight: normal;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .cta-note {
            margin-top: 10px;
            font-size: 11px;
            color: #888;
        }

        /* 画面下固定CTA（iPhoneホームバー対応）*/
        .sticky-cta {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.97);
            padding: 10px 16px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -3px 16px rgba(0,0,0,0.12);
            text-align: center;
            z-index: 100;
        }

        .sticky-cta .cta-btn {
            padding: 15px 16px;
            font-size: clamp(15px, 4vw, 18px);
            animation: none;
            width: 94%;
        }

        /* タブレット以上 */
        @media (min-width: 600px) {
            .cta-btn { font-size: 20px; }
            .sticky-cta .cta-btn { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- LPメイン画像 -->
    <img src="lp.jpg" alt="頭痛でお悩みの方へ｜青山バランスアップ治療院" class="lp-image" loading="eager" decoding="async">

    <!-- 画像下CTA -->
    <div class="cta-section">
        <a href="https://lin.ee/o638sWE" class="cta-btn" target="_blank" rel="noopener">

            LINEで今すぐ予約する ▶
        </a>
        <p class="cta-note">ボタンを押すとLINEアプリが開きます</p>
    </div>

    <!-- 画面下固定CTA -->
    <div class="sticky-cta">
        <a href="https://lin.ee/o638sWE" class="cta-btn" target="_blank" rel="noopener">
            LINEで今すぐ予約する ▶
        </a>
    </div>

</body>
