<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頭痛専門整体院｜青山バランスアップ治療院【秋田市】</title>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "x54rrt6vwc");

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f0f0f0;
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        .page-wrapper {
            max-width: 430px;
            margin: 0 auto;
            background: #fff;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .lp-wrapper {
            position: relative;
            display: block;
        }

        .lp-image {
            display: block;
            width: 100%;
        }

        .line-hotspot {
            position: absolute;
            left: 1.6%;
            width: 96.5%;
            display: block;
            cursor: pointer;
        }

        .line-hotspot-1 { top: 7.6%;  height: 0.5%; }
        .line-hotspot-2 { top: 64.5%; height: 0.5%; }
        .line-hotspot-3 { top: 93.8%; height: 0.5%; }

        /* 画像下CTA */
        .cta-section {
            padding: 24px 16px 20px;
            text-align: center;
            background: #fff8f0;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 92%;
            max-width: 440px;
            margin: 0 auto;
            padding: 14px 18px;
            background: #06C755;
            color: #fff;
            font-size: clamp(16px, 4.5vw, 20px);
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            letter-spacing: 0.04em;
            box-shadow: 0 4px 14px rgba(6, 199, 85, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1);    box-shadow: 0 4px 14px rgba(6,199,85,0.5); }
            50%  { transform: scale(1.03); box-shadow: 0 6px 22px rgba(6,199,85,0.7); }
            100% { transform: scale(1);    box-shadow: 0 4px 14px rgba(6,199,85,0.5); }
        }

        .cta-btn:active { opacity: 0.85; transform: scale(0.98); }

        .btn-icon { flex-shrink: 0; width: 32px; height: 32px; }

        .btn-text { flex: 1; text-align: center; }

        .btn-arrow {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: white;
            display: flex; align-items: center; justify-content: center;
        }

        .cta-note {
            margin-top: 10px;
            font-size: 11px;
            color: #888;
        }

        /* 画面下固定CTA（iPhoneホームバー対応）*/
        .sticky-cta {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.97);
            padding: 10px 16px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -3px 16px rgba(0,0,0,0.12);
            text-align: center;
            z-index: 100;
        }

        .sticky-cta .cta-btn {
            padding: 13px 18px;
            font-size: clamp(15px, 4vw, 18px);
            animation: none;
            width: 94%;
        }

        /* タブレット以上 */
        @media (min-width: 600px) {
            .cta-btn { font-size: 20px; }
            .sticky-cta .cta-btn { font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">

    <!-- LPメイン画像 -->
    <div class="lp-wrapper">
        <img src="lp.jpg" alt="頭痛でお悩みの方へ｜青山バランスアップ治療院" class="lp-image" loading="eager" decoding="async">
        <a href="https://lin.ee/xiSRMSh" class="line-hotspot line-hotspot-1" target="_blank" rel="noopener"></a>
        <a href="https://lin.ee/xiSRMSh" class="line-hotspot line-hotspot-2" target="_blank" rel="noopener"></a>
        <a href="https://lin.ee/xiSRMSh" class="line-hotspot line-hotspot-3" target="_blank" rel="noopener"></a>
    </div>

    <!-- 画像下CTA -->
    <div class="cta-section">
        <a href="https://lin.ee/o638sWE" class="cta-btn" target="_blank" rel="noopener">
            <img src="line-icon.svg" class="btn-icon" alt="LINE">
            <span class="btn-text">LINEで予約する</span>
            <span class="btn-arrow">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M4 2l4 4-4 4" stroke="#06C755" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </a>
        <p class="cta-note">ボタンを押すとLINEアプリが開きます</p>
    </div>

    <!-- 画面下固定CTA -->
    <div class="sticky-cta">
        <a href="https://lin.ee/o638sWE" class="cta-btn" target="_blank" rel="noopener">
            <img src="line-icon.svg" class="btn-icon" alt="LINE">
            <span class="btn-text">LINEで予約する</span>
            <span class="btn-arrow">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M4 2l4 4-4 4" stroke="#06C755" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </a>
    </div>

</div>
</body>
</html>
