        /* 画像下CTA */
        .cta-section {
            padding: 24px 16px 20px;
            text-align: center;
            background: #fff8f0;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 92%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 20px;
            background: #fff2f8;
            color: #9B1054;
            text-decoration: none;
            border-radius: 10px;
            border: 3px solid #9B1054;
            box-shadow: 0 4px 16px rgba(155,16,84,0.25);
            will-change: transform;
            transform-origin: center;
            -webkit-animation: pulse 2s ease-in-out infinite;
            animation: pulse 2s ease-in-out infinite;
        }

        @-webkit-keyframes pulse {
            0%   { -webkit-transform: scale(1);   box-shadow: 0 4px 14px rgba(155,16,84,0.25); }
            50%  { -webkit-transform: scale(1.1); box-shadow: 0 8px 28px rgba(155,16,84,0.45); }
            100% { -webkit-transform: scale(1);   box-shadow: 0 4px 14px rgba(155,16,84,0.25); }
        }
        @keyframes pulse {
            0%   { transform: scale(1);    box-shadow: 0 4px 14px rgba(155,16,84,0.25); }
            50%  { transform: scale(1.1);  box-shadow: 0 8px 28px rgba(155,16,84,0.45); }
            100% { transform: scale(1);    box-shadow: 0 4px 14px rgba(155,16,84,0.25); }
        }

        .cta-btn:active { opacity: 0.85; transform: scale(0.98); }

        .btn-icon { flex-shrink: 0; width: 32px; height: 32px; }

        .btn-text { flex: 1; text-align: center; }

        .btn-arrow {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: white;
            display: flex; align-items: center; justify-content: center;
        }

        .cta-note {
            margin-top: 10px;
            font-size: 11px;
            color: #888;
        }

        /* 画面下固定CTA（iPhoneホームバー対応）*/
        .sticky-cta {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.97);
            padding: 10px 16px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -3px 16px rgba(0,0,0,0.12);
            text-align: center;
            z-index: 100;
        }

        .sticky-cta .cta-btn {
            padding: 10px 16px;
            animation: pulse 2s ease-in-out infinite;
            width: 94%;
        }

        /* タブレット以上 */
        @media (min-width: 600px) {
            .cta-btn { font-size: 20px; }
            .sticky-cta .cta-btn { font-size: 18px; }
        }
