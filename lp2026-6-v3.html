<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青山バランスアップ治療院 | 頭痛施術専門整体</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#f0ede8;}
body{padding-bottom:84px;}

/* LP 画像ラッパー */
.lp-wrap{max-width:480px;margin:0 auto;position:relative;overflow:hidden;}
.lp-img{width:100%;display:block;}

/* 画像内のHP予約ボタン位置にクリッカブルエリアを設置 */
.hotspot{position:absolute;left:5%;width:90%;background:transparent;cursor:pointer;text-decoration:none;display:block;}
.hs-1{top:15.9%;height:2.3%;}
.hs-2{top:31.8%;height:2.3%;}
.hs-3{top:52.4%;height:2.3%;}
.hs-4{top:74.9%;height:2.3%;}

/* ── スティッキー下部 HP Beauty バナー ── */
.sticky-wrap {
  position: fixed;
  bottom: 10px;
  left: 50%;
  width: calc(100% - 28px);
  max-width: 452px;
  z-index: 1000;
  text-decoration: none;
  display: block;
  transform-origin: 50% 100%;
  animation: hpb-spread 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  will-change: transform, filter;
}

@keyframes hpb-spread {
  0%   { transform: translateX(-50%) scaleX(0.82);
         filter: drop-shadow(0 2px 6px rgba(200,24,94,0.20)); }
  50%  { transform: translateX(-50%) scaleX(1.00);
         filter: drop-shadow(0 5px 18px rgba(200,24,94,0.52)); }
  100% { transform: translateX(-50%) scaleX(0.82);
         filter: drop-shadow(0 2px 6px rgba(200,24,94,0.20)); }
}

@media (prefers-reduced-motion: reduce) {
  .sticky-wrap { animation: none; transform: translateX(-50%); }
}

/* SVGをフル幅で表示 */
.sticky-wrap svg {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
}
</style>
</head>
<body>

<div class="lp-wrap">
  <img src="canva_lp.jpg" class="lp-img" alt="青山バランスアップ治療院 頭痛施術専門整体LP">
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" target="_blank" class="hotspot hs-1" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" target="_blank" class="hotspot hs-2" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" target="_blank" class="hotspot hs-3" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" target="_blank" class="hotspot hs-4" aria-label="ホットペッパービューティーで予約する"></a>
</div>

<!-- HP Beauty バナーボタン（SVGインライン）-->
<a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/"
   target="_blank"
   class="sticky-wrap"
   aria-label="ホットペッパービューティーで予約する">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 58" role="img" aria-label="HOT PEPPER Beauty 予約する">
    <!-- 外枠 -->
    <rect width="440" height="58" rx="8" ry="8"
          fill="white" stroke="#c8185e" stroke-width="2.5"/>
    <!-- 右エリア薄ピンク -->
    <rect x="168" y="2.5" width="269.5" height="53"
          fill="#fff5f8" rx="0"/>
    <!-- 右角丸（右側のみ） -->
    <rect x="432" y="2.5" width="5.5" height="53" fill="#fff5f8"/>
    <!-- 区切り縦線 -->
    <line x1="168" y1="11" x2="168" y2="47"
          stroke="#e8b0c8" stroke-width="1.5"/>

    <!-- B バッジ：円 -->
    <circle cx="43" cy="29" r="19.5" fill="white" stroke="#c8185e" stroke-width="2"/>
    <!-- B 文字（HP Beautyスタイル：太字イタリックセリフ） -->
    <text x="43.5" y="37.5"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="25" font-weight="700" font-style="italic"
          fill="#c8185e" text-anchor="middle"
          dominant-baseline="auto">B</text>

    <!-- HOT PEPPER （超小） -->
    <text x="76" y="22"
          font-family="Arial, Helvetica, sans-serif"
          font-size="7.5" font-weight="700"
          letter-spacing="1.3" fill="#c8185e">HOT PEPPER</text>

    <!-- Beauty （大きめイタリックセリフ） -->
    <text x="74" y="41"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="21" font-style="italic"
          fill="#c8185e" letter-spacing="0.8">Beauty</text>

    <!-- 予約する ▶ -->
    <text x="307" y="35.5"
          font-family="'Hiragino Sans', 'Noto Sans JP', 'Meiryo', sans-serif"
          font-size="17" font-weight="800"
          fill="#1a1a1a" text-anchor="middle"
          letter-spacing="1.5">予約する ▶</text>
  </svg>
</a>

</body>
</html>
