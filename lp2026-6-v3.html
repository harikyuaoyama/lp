<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青山バランスアップ治療院 | 頭痛施術専門整体</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#f0ede8;}
body{padding-bottom:84px;}

/* LP 画像ラッパー */
.lp-wrap{max-width:480px;margin:0 auto;position:relative;overflow:hidden;}
.lp-img{width:100%;display:block;}

/* 画像内のHP予約ボタン位置にクリッカブルエリアを設置 */
.hotspot{position:absolute;left:5%;width:90%;background:transparent;cursor:pointer;text-decoration:none;display:block;}
.hs-1{top:15.9%;height:2.3%;}
.hs-2{top:31.8%;height:2.3%;}
.hs-3{top:52.4%;height:2.3%;}
.hs-4{top:74.9%;height:2.3%;}

/* ── スティッキー下部 HP Beauty バナー ── */
.sticky-wrap {
  position: fixed;
  bottom: 12px;
  left: 50%;
  width: calc(100% - 32px);
  max-width: 448px;
  z-index: 1000;
  text-decoration: none;
  display: block;
  transform-origin: 50% 100%;
  animation: hpb-spread 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  will-change: transform, filter;
}

@keyframes hpb-spread {
  0%   { transform: translateX(-50%) scaleX(0.82);
         filter: drop-shadow(0 2px 6px rgba(200,24,94,0.20)); }
  50%  { transform: translateX(-50%) scaleX(1.00);
         filter: drop-shadow(0 5px 18px rgba(200,24,94,0.52)); }
  100% { transform: translateX(-50%) scaleX(0.82);
         filter: drop-shadow(0 2px 6px rgba(200,24,94,0.20)); }
}

@media (prefers-reduced-motion: reduce) {
  .sticky-wrap { animation: none; transform: translateX(-50%); }
}

.sticky-wrap img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
}
</style>
</head>
<body>

<div class="lp-wrap">
  <img src="canva_lp.jpg" class="lp-img" alt="青山バランスアップ治療院 頭痛施術専門整体LP">
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" class="hotspot hs-1" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" class="hotspot hs-2" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" class="hotspot hs-3" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" class="hotspot hs-4" aria-label="ホットペッパービューティーで予約する"></a>
</div>

<!-- HP Beauty 実際のボタン画像 + 広がるアニメーション -->
<a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/"
   class="sticky-wrap"
   aria-label="ホットペッパービューティーで予約する">
  <img src="hpb_btn.png" alt="HOT PEPPER Beauty 予約する">
</a>

</body>
</html>
