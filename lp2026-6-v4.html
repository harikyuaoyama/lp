<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青山バランスアップ治療院 | 頭痛施術専門整体</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#faf1cb;}
body{padding-bottom:78px;}

/* LP 画像ラッパー：横幅ギリギリ・左右余白ゼロ */
.lp-wrap{max-width:500px;margin:0 auto;position:relative;overflow:hidden;line-height:0;}
.lp-img{width:100%;display:block;}

/* 画像内「予約する」ボタン位置の透明クリックエリア */
.hotspot{position:absolute;left:18%;width:64%;height:1.2%;background:transparent;cursor:pointer;text-decoration:none;display:block;}
.hs-1{top:7.21%;}
.hs-2{top:64.19%;}
.hs-3{top:93.49%;}

/* ── スティッキー下部 HP Beauty バナー ── */
.sticky-wrap{
  position:fixed;
  bottom:10px;
  left:50%;
  width:calc(100% - 24px);
  max-width:470px;
  z-index:1000;
  text-decoration:none;
  display:block;
  transform-origin:50% 100%;
  animation:hpb-spread 2.2s cubic-bezier(0.45,0,0.55,1) infinite;
  will-change:transform,filter;
}
@keyframes hpb-spread{
  0%   {transform:translateX(-50%) scaleX(0.84); filter:drop-shadow(0 2px 6px rgba(150,20,80,0.22));}
  50%  {transform:translateX(-50%) scaleX(1.00); filter:drop-shadow(0 5px 18px rgba(150,20,80,0.50));}
  100% {transform:translateX(-50%) scaleX(0.84); filter:drop-shadow(0 2px 6px rgba(150,20,80,0.22));}
}
@media (prefers-reduced-motion:reduce){
  .sticky-wrap{animation:none;transform:translateX(-50%);}
}
.sticky-wrap img{width:100%;height:auto;display:block;border-radius:8px;background:#fff;}
</style>
</head>
<body>

<div class="lp-wrap">
  <img src="lp2026-6-v4.jpg" class="lp-img" alt="青山バランスアップ治療院 頭痛施術専門整体LP">
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" class="hotspot hs-1" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" class="hotspot hs-2" aria-label="ホットペッパービューティーで予約する"></a>
  <a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/" class="hotspot hs-3" aria-label="ホットペッパービューティーで予約する"></a>
</div>

<!-- HP Beauty 固定CTA：広がるアニメーション付き -->
<a href="https://beauty.hotpepper.jp/kr/slnH000772562/coupon/CT01/"
   class="sticky-wrap"
   aria-label="ホットペッパービューティーで予約する">
  <img src="lp2026-6-v4-btn.png" alt="HOT PEPPER Beauty 予約する">
</a>

</body>
</html>
